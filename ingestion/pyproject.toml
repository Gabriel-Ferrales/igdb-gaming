[project]
name = "igdb-pipeline"
version = "0.1.0"
description = "IGDB extraction and Google Cloud loading pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "requests>=2.32",
  "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
igdb-pipeline = "igdb_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

